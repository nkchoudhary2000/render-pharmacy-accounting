services:
  # -------------------------------------------------------------
  # Backend: FastAPI Web Service
  # -------------------------------------------------------------
  - type: web
    name: pharmacy-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
        # Paste your Neon PostgreSQL connection string here or set in Render dashboard:
        # postgresql+asyncpg://neondb_owner:password@ep-xyz.us-east-2.aws.neon.tech/neondb?ssl=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # -------------------------------------------------------------
  # Frontend: React Vite Static Site
  # -------------------------------------------------------------
  - type: static
    name: pharmacy-frontend
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pharmacy-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
